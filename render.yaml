services:
  - type: web
    name: taylor-research-partner
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: USE_BUNDLED_CORPUS
        value: true
      - key: AUTH_REQUIRED
        value: true
      - key: LOCAL_FILE_ACCESS
        value: false
      - key: ALLOW_CLIENT_API_KEYS
        value: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: 12000
      - key: APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ACCESS_REQUESTS_ENABLED
        value: true
